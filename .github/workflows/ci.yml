name: gitops-ci

on:
  push:
    branches: [main]
    paths: ["app/**"]

permissions:
  contents: write
  packages: write

concurrency:
  group: gitops-ci
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/belaruso4ka/readings

jobs:
  build-push-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        working-directory: app
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -v

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t "$IMAGE:${{ github.sha }}" app

      - name: Push image
        run: docker push "$IMAGE:${{ github.sha }}"

      - name: Bump image tag in infra/deployment.yaml
        run: |
          sed -i -E "s#(image: $IMAGE):.*#\1:${{ github.sha }}#" infra/deployment.yaml
          grep -n "image:" infra/deployment.yaml
          grep -q "image: $IMAGE:${{ github.sha }}" infra/deployment.yaml

      - name: Commit and push bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/deployment.yaml
          if git diff --cached --quiet; then echo "tag is already up to date"; exit 0; fi
          git commit -m "ci: bump readings image to ${{ github.sha }}"
          git pull --rebase origin main
          git push origin HEAD:main
